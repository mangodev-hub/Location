<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Mi Ubicación GPS 
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Coordenadas</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngIf="latitude() !== null && longitude() !== null">
    <ion-card-header>
      <ion-card-title>Mi ubicación actual</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>Latitud:</strong> {{ latitude() | number: '1.6-6' }}</p>
      <p><strong>Longitud:</strong> {{ longitude() | number: '1.6-6' }}</p>
      <ion-button
        expand="block"
        fill="outline"
        [href]="'https://www.google.com/maps/search/?api=1&query=' + latitude() + ',' + longitude()"
        target="_blank"
        rel="noopener noreferrer">
        Ver en Google Maps
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="errorMsg()">
    <ion-card-content>
      <p>{{ errorMsg() }}</p>
    </ion-card-content>
  </ion-card>


  <div class="ion-margin-top">
    <ion-button expand="block" color="primary" (click)="obtenerUbicacion()">
      <ion-icon name="location-outline" slot="start"></ion-icon>
      Obtener Ubicación
    </ion-button>

    <ion-button
      expand="block"
      color="secondary"
      (click)="iniciarSeguimiento()"
      [disabled]="isTracking()">
      <ion-icon name="play-circle-outline" slot="start"></ion-icon>
      Iniciar seguimiento
    </ion-button>

    <ion-button
      expand="block"
      color="danger"
      fill="outline"
      (click)="detenerSeguimiento()"
      [disabled]="!isTracking()">
      <ion-icon name="stop-circle-outline" slot="start"></ion-icon>
      Detener seguimiento
    </ion-button>
  </div>
</ion-content>
